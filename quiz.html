    "q": "理想流体的密度和黏度不同于实际流体，它们是（ ）",

  {

    "ch": "2",
    "date": "09-14",
    "type": "单选",
    "ans": "B",
    "mine": "未提交",
    "q": "定常流动指的是：（ ）",

  },
  {
    "id": "Q2-3",
    "ch": "2",
    "date": "09-14",
    "type": "单选",
    "ans": "C",
    "mine": "C",
    "q": "（分叉管道图：主管道流量 $Q_1$ 分成两条支管 $Q_2$ 和 $Q_3$）管中流量的描述哪个是正确的？（ ）",
    "opts": [
      "A. $Q_1 > Q_2 > Q_3$",
      "B. $Q_1 = Q_2 = Q_3$",
      "C. $Q_1 = Q_2 + Q_3$"
    ],
    "exp": "<strong>连续性方程（质量守恒）：</strong>流入分叉口的总流量等于流出两条支管的流量之和，即 $Q_1 = Q_2 + Q_3$。选 <strong>C</strong>。"
  },
  {
    "id": "Q2-4",
    "ch": "2",
    "date": "09-14",
    "type": "单选",
    "ans": "A",
    "mine": "A",
    "q": "理想流体在水平管中定常流动，下列说法正确的是（ ）",

      "A. 截面积小处，流速大，压强小。",
      "B. 截面积小处，流速大，压强大。",

    "exp": "<strong>口诀秒杀：</strong>由连续性方程 $Sv=\\text{常量}$ 知“截面积小 $\\Rightarrow$ 流速大”；由水平伯努利方程 $p+\\frac{1}{2}\\rho v^2=\\text{常量}$ 知“流速大 $\\Rightarrow$ 压强小”。选 <strong>A</strong>。"
  },
  {

    "ch": "2",
    "date": "09-14",
    "type": "单选",
    "ans": "B",

      "C. $p_A = p_B$"

    "exp": "水平管伯努利方程：流速越快，压强越小。$v_A &gt; v_B \\implies p_A &lt; p_B$。选 <strong>B</strong>。"
  },
  {
    "id": "Q2-6",
    "ch": "2",
    "date": "09-14",
    "type": "单选",
    "ans": "B",
    "mine": "B",

  },

    "ch": "2",
    "date": "09-14",

    "ans": "D",
    "mine": "D",

    "exp": "和吹纸实验同理：两球中间气流快 $\\Rightarrow$ 压强小，两侧大气压把两球向中间推拢，这是典型的<strong>伯努利原理</strong>现象。选 <strong>D</strong>。"
  },
  {
    "id": "Q2-8",
    "ch": "2",
    "date": "09-18",
    "type": "多选",
    "ans": "CD",

    "opts": [

      "D. 同一流管、理想流体、定常流动条件下适用"

    "exp": "<strong>三大适用条件缺一不可：</strong>① 理想流体（不可压缩、无黏性）；② 定常流动；③ 同一流管（同一条流线）。本质上是流体的机械能守恒。选 <strong>CD</strong>。"
  },

    "date": "09-18",
    "type": "单选",

    "exp": "<strong>⚠️ 课堂错题说明：</strong>严格来说没给原磁场方向确实无法判断，但本题原题配图设定为向外的磁感线减少（增反减同 $\\Rightarrow$ 感应磁场也向外 $\\Rightarrow$ 逆时针），学习通系统标准答案为 <strong>B</strong>，考试遇到有配图的题一定要先看清原磁场是 $\\otimes$（向里）还是 $\\odot$（向外）！"
  },
  {
    "id": "Q7-3",
    "ch": "7",
    "date": "11-20",
    "type": "单选",
    "ans": "C",
    "mine": "C",
    "q": "在无限长载流直导线旁，放置一圆形导体线框且共面。下列情况中线框会产生感应电动势的是：（ ）",
    "opts": [
      "A. 线框与直导线相对静止",
      "B. 线框的速度 $v$ 沿纸面向上运动（平行直导线）",
      "C. 直导线的电流增大，线框与直导线相对静止",
      "D. 线框绕过圆心 $O$ 且垂直纸面的轴转动"
    ],
    "exp": "A、B、D 中线框距直导线的距离分布都没变，穿过线框的磁通量 $\\Phi$ 不变；只有 C 中直导线电流增大，磁场变强导致 $\\Phi$ 增大，从而产生感应电动势！选 <strong>C</strong>。"
  },
  {
    "id": "Q7-4",
    "ch": "7",
    "date": "11-20",
    "type": "单选",
    "ans": "C",
    "mine": "A",
    "q": "一个圆形线环，一半放在方形区域的匀强磁场中（磁场 $\\vec{B}$ 垂直指向纸内），另一半在磁场外。欲使圆线环中产生逆时针方向的感应电流，应使（ ）",
    "opts": [
      "A. 线环向右平移",
      "B. 线环向上平移",
      "C. 线环向左平移",
      "D. 磁场强度减弱"
    ],
    "exp": "<strong>⚠️ 课堂错题重点复盘：</strong>要产生<strong>逆时针</strong>感应电流 $\\implies$ 感应磁场指向<strong>纸外</strong>（与原向里磁场<strong>相反</strong>）$\\implies$ 由“增反减同”说明<strong>原向里磁通量必须增大</strong>！结合原图（磁场在左侧），只有将线环<strong>向左平移</strong>进入磁场，才能使磁通量增大。选 <strong>C</strong>。"
  },
  {
    "id": "Q7-5",
    "ch": "7",
    "date": "11-20",
    "type": "单选",
    "ans": "D",
    "mine": "B",
    "q": "长度为 $l$ 的直导线 $ab$ 在均匀磁场中以速度 $v$ 在纸面内移动（图中磁场 $\\vec{B}$ 也在纸面内，与速度、导线共面），直导线 $ab$ 中的电动势为（ ）",
    "opts": [
      "A. $Blv$",
      "B. $Blv\\sin\\alpha$",

      "D. $0$"
    ],
    "exp": "<strong>⚠️ 课堂错题重点复盘：</strong>记住动生电动势的几何意义——$\\mathcal{E} = (\\vec{v}\\times\\vec{B})\\cdot\\vec{l}$！只要 $\\vec{v}、\\vec{B}、\\vec{l}$ 三个矢量<strong>共面</strong>（都在纸面内），$\\vec{v}\\times\\vec{B}$ 垂直于纸面，和纸面内的导线 $\\vec{l}$ 垂直，点乘必为 <strong>$0$</strong>（根本没有切割磁感线）！选 <strong>D</strong>。"
  },
  {

    "type": "单选",
    "ans": "C",
    "mine": "C",
    "q": "激发涡旋电场的场源是（ ）",
    "opts": [
      "A. 静止电荷",
      "B. 运动电荷",
      "C. 变化的磁场",
      "D. 电流"
    ],
    "exp": "<strong>麦克斯韦核心概念：</strong>静止电荷激发静电场（保守场）；<strong>变化的磁场</strong>激发<strong>涡旋电场（感生电场，非保守场）</strong>！选 <strong>C</strong>。"
  },
  {
    "id": "Q7-7",
    "ch": "7",
    "date": "11-20",
    "type": "单选",
    "ans": "B",
    "mine": "B",
    "q": "一载流螺线管的旁边有一圆形线圈，欲使线圈产生图示方向的感应电流 $i$（其感应磁场与螺线管磁场同向），下列哪一种情况可以做到？（ ）",
    "opts": [
      "A. 载流螺线管向线圈靠近",
      "B. 载流螺线管离开线圈",
      "C. 载流螺线管中电流增大"
    ],
    "exp": "感应磁场与原磁场<strong>同向</strong> $\\implies$ 由“增反减同”说明穿过线圈的原磁通量正在<strong>减少</strong>，只有将螺线管<strong>离开线圈</strong>才能使磁通量减少。选 <strong>B</strong>。"
  }
];
    const STORE_KEY = 'u_physics_quiz_state_v1';
    let qState = JSON.parse(localStorage.getItem(STORE_KEY) || '{"answers":{},"starred":{},"multiTemp":{}}');
    let dark = JSON.parse(localStorage.getItem('u_physics_review_state_v1') || '{"dark":false}').dark;
    let modeFilter = 'all';
    let chFilter = 'all';
    let revealAll = false;

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(qState));
      updateStats();
    }

    function isClassWrong(q) {
      return q.mine !== '未提交' && q.mine !== q.ans;
    }

    function updateStats() {
      const answered = QUIZZES.filter(q => qState.answers[q.id]).length;
      const right = QUIZZES.filter(q => qState.answers[q.id] === q.ans).length;
      const pct = Math.round((right / QUIZZES.length) * 100);
      document.getElementById('progText').textContent = `已答 ${answered} / ${QUIZZES.length} · 答对 ${right} 题 (${pct}%)`;
      document.getElementById('progFill').style.width = `${pct}%`;
    }

    function renderMath(el) {
      if (window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function render() {
      const list = QUIZZES.filter(q => {
        if (chFilter !== 'all' && q.ch !== chFilter) return false;
        if (modeFilter === 'class_wrong') return isClassWrong(q);
        if (modeFilter === 'class_unsub') return q.mine === '未提交';
        if (modeFilter === 'starred') return !!qState.starred[q.id];
        if (modeFilter === 'unanswered') return !qState.answers[q.id];
        return true;
      });
      document.getElementById('countInfo').textContent = `当前显示：${list.length} 题`;
      const box = document.getElementById('quizList');
      if (!list.length) {
        box.innerHTML = '<div class="q-card" style="text-align:center;color:var(--muted);">当前筛选下暂无题目 🎉</div>';
        return;
      }

      box.innerHTML = list.map((q, idx) => {
        const userAns = qState.answers[q.id] || '';
        const submitted = !!userAns;
        const isRight = submitted && userAns === q.ans;
        const showExp = submitted || revealAll;
        const multiSel = qState.multiTemp[q.id] || [];
        const cw = isClassWrong(q);
        const star = !!qState.starred[q.id];

        const optHtml = q.opts.map((opt, oi) => {
          const letter = String.fromCharCode(65 + oi);
          let cls = 'opt-btn';
          if (showExp) {
            if (q.ans.includes(letter)) cls += ' is-right';
            else if (userAns.includes(letter)) cls += ' is-wrong';
          } else if (q.type === '多选' && multiSel.includes(letter)) {
            cls += ' selected';
          }
          const fn = q.type === '单选'
            ? `pickSingle('${q.id}','${letter}')`
            : `toggleMulti('${q.id}','${letter}')`;
          return `<button class="${cls}" onclick="${fn}">${opt}</button>`;
        }).join('');

        return `
          <div class="q-card ${submitted ? (isRight ? 'correct' : 'wrong') : ''}">
            <div class="q-head">
              <span class="q-num">#${idx + 1} · 第 ${q.ch} 章（${q.date} 随堂练习）</span>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <span class="badge">${q.type}题</span>
                ${cw ? `<span class="badge badge-danger">课堂曾错(选${q.mine})</span>` : ''}
                ${q.mine === '未提交' ? '<span class="badge badge-warn">课堂未交</span>' : ''}
                ${submitted ? (isRight ? '<span class="badge badge-success">✅ 答对</span>' : `<span class="badge badge-danger">❌ 选了 ${userAns}</span>`) : ''}
              </div>
            </div>
            <div class="q-stem">${q.q}</div>
            <div class="opts">${optHtml}</div>
            <div class="q-actions">
              ${q.type === '多选' && !submitted ? `<button class="btn btn-primary" onclick="submitMulti('${q.id}')">✅ 确认多选答案</button>` : ''}
              <button class="btn" onclick="document.getElementById('exp-${q.id}').classList.toggle('open')">📖 展开/收起答案与解析</button>
              <button class="btn ${star ? 'btn-warn' : ''}" onclick="toggleStar('${q.id}')">${star ? '⭐ 已在错题本' : '☆ 加入错题本'}</button>
            </div>
            <div class="q-exp ${showExp ? 'open' : ''}" id="exp-${q.id}">
              <strong>🎯 正确答案：${q.ans}</strong>（课堂记录：${q.mine}）<br/>
              ${q.exp}
            </div>
          </div>`;
      }).join('');
      renderMath(box);
    }

    window.pickSingle = (id, letter) => {
      qState.answers[id] = letter;
      save(); render();
    };
    window.toggleMulti = (id, letter) => {
      if (qState.answers[id]) return;
      const arr = qState.multiTemp[id] || [];
      const i = arr.indexOf(letter);
      if (i >= 0) arr.splice(i, 1); else arr.push(letter);
      arr.sort();
      qState.multiTemp[id] = arr;
      render();
    };
    window.submitMulti = (id) => {
      const arr = qState.multiTemp[id] || [];
      if (!arr.length) return;
      qState.answers[id] = arr.join('');
      save(); render();
    };
    window.toggleStar = (id) => {
      qState.starred[id] = !qState.starred[id];
      save(); render();
    };

    document.querySelectorAll('#modeFilters .chip').forEach(c => c.addEventListener('click', () => {
      document.querySelectorAll('#modeFilters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active'); modeFilter = c.dataset.mode; render();
    }));
    document.querySelectorAll('#chFilters .chip').forEach(c => c.addEventListener('click', () => {
      document.querySelectorAll('#chFilters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active'); chFilter = c.dataset.ch; render();
    }));
    document.getElementById('revealAllBtn').addEventListener('click', (e) => {
      revealAll = !revealAll;
      e.target.textContent = revealAll ? '🙈 一键隐藏答案与解析' : '👁️ 一键显示全部答案与解析';
      render();
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('确定清空本次在网页上的刷题作答记录吗？（错题本会保留）')) {
        qState.answers = {}; qState.multiTemp = {}; save(); render();
      }
    });
    document.getElementById('themeBtn').addEventListener('click', () => {
      dark = !dark;
      document.body.classList.toggle('dark', dark);
      document.getElementById('themeBtn').textContent = dark ? '☀️ 日间模式' : '🌙 夜间模式';
      const mainState = JSON.parse(localStorage.getItem('u_physics_review_state_v1') || '{}');
      mainState.dark = dark;
      localStorage.setItem('u_physics_review_state_v1', JSON.stringify(mainState));
    });

    window.addEventListener('load', () => {
      if (dark) {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️ 日间模式';
      }
      updateStats();
      render();
    });
  </script>
</body>
</html>

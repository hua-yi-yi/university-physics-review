  <script>
    const PROBLEMS = [
      {
        id: '2-1', ans: '出流速度 $v \\approx 1.98\\text{ m/s}$（取 $g=10$ 为 $2.0\\text{ m/s}$）；流量 $Q \\approx 1.98\\times 10^{-4}\\text{ m}^3/\\text{s}$。', ch: '2', orig: '2.8', tag: '托里拆利公式 · 流量',
        stem: '一个装满水的容器的侧壁有一面积为 $1.0\\times 10^{-4}\\text{ m}^2$、位于水面下 $0.20\\text{ m}$ 处的小孔。求从孔的出流速度及流量。',
        hint: '直接套用托里拆利公式 $v = \\sqrt{2gh}$ 和体积流量 $Q = Sv$。',
        sol: '<p><strong>① 提取已知量与单位换算：</strong></p><ul><li>小孔面积 $S = 1.0\\times 10^{-4}\\text{ m}^2$（已是国际单位，不用换算）；</li><li>小孔距水面的垂直深度 $h = 0.20\\text{ m}$；重力加速度取 $g = 9.8\\text{ m/s}^2$。</li></ul><p><strong>② 解题思路：</strong>容器装满水且侧壁开小孔，水面很大（几乎不动，$v_1\\approx 0$），水面和小孔都直接接触外界大气（压强都是 $p_0$），直接套用<strong>托里拆利公式</strong> $v=\\sqrt{2gh}$ 求速度，再用 $Q=Sv$ 求流量。</p><p><strong>③ 分步代入计算：</strong></p><ol><li><strong>求出流速度 $v$：</strong>$$v = \\sqrt{2gh} = \\sqrt{2 \\times 9.8 \\times 0.20} = \\sqrt{3.92} \\approx \\mathbf{1.98\\text{ m/s}}$$（注：如果题目或老师习惯取 $g=10\\text{ m/s}^2$，则 $v=\\sqrt{4}=2.0\\text{ m/s}$。）</li><li><strong>求体积流量 $Q$（每秒流出的水体积）：</strong>$$Q = S v = (1.0\\times 10^{-4}\\text{ m}^2) \\times 1.98\\text{ m/s} \\approx \\mathbf{1.98\\times 10^{-4}\\text{ m}^3/\\text{s}}$$</li></ol><p><strong>④ 易错提醒：</strong>单位别写错！速度单位是 $\\text{m/s}$，流量是“面积 $\\times$ 速度”，单位是 $\\text{m}^3/\\text{s}$。</p>'
      },
      {
        id: '2-2', ans: '最细处压强 $p_{\\text{细}} \\approx 8.53\\times 10^4\\text{ Pa}$（相对大气压 $-1.6\\times 10^4\\text{ Pa}$）；开小孔<strong>水不会流出</strong>，外界空气会被吸入管内。', ch: '2', orig: '2-9', tag: '连续性方程 · 伯努利方程',
        stem: '水在截面不同的水平管中做稳定流动，出口处的截面积为管的最细处的 3 倍。若出口处的流速为 $2\\text{ m}\\cdot\\text{s}^{-1}$，则最细处的压强为多少？若在最细处开一小孔，水会不会流出来？',
        hint: '先用 $S_1v_1=S_2v_2$ 算最细处流速 $6\\text{ m/s}$，再用水平管伯努利方程与大气压 $p_0$ 比较。',
        sol: '<p><strong>① 提取已知量：</strong></p><ul><li>水平管（高度相同，$h_{\\text{细}} = h_{\\text{出}}$，伯努利方程里 $\\rho gh$ 直接消掉）；</li><li>截面积关系：$S_{\\text{出}} = 3 S_{\\text{细}}$；出口流速：$v_{\\text{出}} = 2\\text{ m/s}$；</li><li>出口直接通向外界空气，所以出口压强就是标准大气压：$p_{\\text{出}} = p_0 = 1.013\\times 10^5\\text{ Pa}$；水的密度 $\\rho = 1.0\\times 10^3\\text{ kg/m}^3$。</li></ul><p><strong>② 分步代入计算：</strong></p><ol><li><strong>先用连续性方程求最细处流速 $v_{\\text{细}}$：</strong>由 $S_{\\text{细}} v_{\\text{细}} = S_{\\text{出}} v_{\\text{出}}$，把 $S_{\\text{出}} = 3 S_{\\text{细}}$ 代入，两边消掉 $S_{\\text{细}}$：$$v_{\\text{细}} = 3 v_{\\text{出}} = 3 \\times 2 = \\mathbf{6\\text{ m/s}}$$</li><li><strong>再用水平管伯努利方程求最细处压强 $p_{\\text{细}}$：</strong>$$p_{\\text{细}} + \\frac{1}{2}\\rho v_{\\text{细}}^2 = p_0 + \\frac{1}{2}\\rho v_{\\text{出}}^2$$移项把未知数 $p_{\\text{细}}$ 留在左边：$$p_{\\text{细}} = p_0 + \\frac{1}{2}\\rho\\left(v_{\\text{出}}^2 - v_{\\text{细}}^2\\right) = 1.013\\times 10^5 + \\frac{1}{2}\\times 10^3\\times(2^2 - 6^2)$$先算括号里：$2^2 - 6^2 = 4 - 36 = -32$；再乘 $500$ 得 $-16000\\text{ Pa} = -1.6\\times 10^4\\text{ Pa}$：$$p_{\\text{细}} = 1.013\\times 10^5 - 0.16\\times 10^5 = \\mathbf{8.53\\times 10^4\\text{ Pa}}$$</li><li><strong>判断在最细处开小孔会不会出水：</strong>因为管内最细处压强 $8.53\\times 10^4\\text{ Pa}$ <strong>小于</strong>管外大气压 $1.013\\times 10^5\\text{ Pa}$，外面气压更高，所以<strong>水不会流出来，反而外界空气会被压进（吸入）管内</strong>！</li></ol>'
      },
      {
        id: '2-3', ans: '容器最小深度 $h \\approx 0.459\\text{ m}$（取 $g=10$ 为 $0.45\\text{ m}$）。', ch: '2', orig: '2-10', tag: '流量平衡 · 最小深度',
        stem: '匀速地将流量为 $Q=1.5\\times 10^{-4}\\text{ m}^3\\cdot\\text{s}^{-1}$ 的水注入一容器中，容器底有一面积为 $S=0.5\\times 10^{-4}\\text{ m}^2$ 的小孔，使水不断流出，试求：该容器的深度至少为多少米水才不会溢出？',
        hint: '不溢出临界条件：流出流量 $S\\sqrt{2gh}$ 等于注入流量 $Q$。',
        sol: '<p><strong>① 提取已知量：</strong>注入水的流量 $Q_{\\text{注}} = 1.5\\times 10^{-4}\\text{ m}^3/\\text{s}$；底部小孔面积 $S = 0.5\\times 10^{-4}\\text{ m}^2$；$g=9.8\\text{ m/s}^2$。</p><p><strong>② 物理直觉（怎么才不会溢出？）：</strong>水越深，底孔喷水越快。当水面涨到容器顶部（深度为 $h$）时，只要此时底部漏水的流量 $Q_{\\text{出}}$ <strong>刚好等于</strong>上面注水的流量 $Q_{\\text{注}}$，水面就不会继续上涨，水也就不会溢出了！</p><p><strong>③ 分步代入计算：</strong></p><ol><li>由托里拆利公式，水深 $h$ 时底孔出流速度 $v = \\sqrt{2gh}$，故流出流量 $Q_{\\text{出}} = S\\sqrt{2gh}$。</li><li>令 $Q_{\\text{出}} = Q_{\\text{注}}$：$$S\\sqrt{2gh} = Q \\implies \\sqrt{2gh} = \\frac{Q}{S}$$</li><li><strong>技巧：先算 $\\frac{Q}{S}$ 约掉 $10^{-4}$！</strong>$$\\frac{Q}{S} = \\frac{1.5\\times 10^{-4}}{0.5\\times 10^{-4}} = 3\\text{ m/s}$$</li><li>两边平方解 $h$：$$2gh = 3^2 = 9 \\implies h = \\frac{9}{2\\times 9.8} = \\frac{9}{19.6} \\approx \\mathbf{0.459\\text{ m}}$$（若取 $g=10\\text{ m/s}^2$，则 $h = 9/20 = 0.45\\text{ m}$。）</li></ol>'
      },
      {
        id: '3-1', ans: '吹泡做功 $W \\approx 2.51\\times 10^{-3}\\text{ J}$；泡内外压强差 $\\Delta p = 3.2\\text{ Pa}$。', ch: '3', orig: '3.6', tag: '肥皂泡双液面 · 附加压强',
        stem: '吹一个直径为 $10\\text{ cm}$ 的肥皂泡，设肥皂液的表面张力系数 $\\alpha=40\\times 10^{-3}\\text{ N/m}$，试求吹此肥皂泡所做的功，以及泡内外的压强差。',
        hint: '肥皂泡有内外 <strong>2 个球面</strong>！而且题目给的是直径 $d=10\\text{ cm}$，先除以 2 得 $r=0.05\\text{ m}$。',
        sol: '<p><strong>① 提取已知量与单位换算（防坑关键！）：</strong></p><ul><li>题目给的是<strong>直径</strong> $d = 10\\text{ cm}$，第一步立刻除以 2 变半径并换算成米：$r = \\frac{d}{2} = 5\\text{ cm} = 0.05\\text{ m}$；</li><li>表面张力系数 $\\alpha = 40\\times 10^{-3}\\text{ N/m} = 0.04\\text{ N/m}$；</li><li><strong>核心提醒</strong>：肥皂泡是一层薄液膜，里面是空气、外面也是空气，所以有<strong>内、外两个球形液面</strong>！</li></ul><p><strong>② 分步代入计算：</strong></p><ol><li><strong>求吹泡做的功 $W$：</strong>一个球面积是 $4\\pi r^2$，两个面总新增面积 $\\Delta S = 2\\times 4\\pi r^2 = 8\\pi r^2$：$$W = \\alpha \\Delta S = 8\\pi \\alpha r^2 = 8\\times 3.1416 \\times 0.04 \\times (0.05)^2$$先算 $0.05^2 = 0.0025$，再算 $0.04 \\times 0.0025 = 0.0001 = 10^{-4}$，最后 $8\\pi \\times 10^{-4} \\approx \\mathbf{2.51\\times 10^{-3}\\text{ J}}$。</li><li><strong>求泡内外压强差 $\\Delta p$：</strong>每个弯曲球面贡献 $\\frac{2\\alpha}{r}$，内外两个面相加就是 $\\frac{4\\alpha}{r}$：$$\\Delta p = \\frac{4\\alpha}{r} = \\frac{4\\times 0.04}{0.05} = \\frac{0.16}{0.05} = \\mathbf{3.2\\text{ Pa}}$$</li></ol>'
      },
      {
        id: '3-2', ans: '释放能量 $\\Delta E = 1.095\\times 10^8\\text{ J}$（约 $1.10\\times 10^8\\text{ J}$）。', ch: '3', orig: '3-7', tag: '雨滴合并 · 表面能释放',
        stem: '在 $10\\text{ km}^2$ 的湖面上，下了一场 $25\\text{ mm}$ 的大雨，雨滴直径为 $1\\text{ mm}$，设过程是等温的，求释放出来的能量（$\\alpha=7.3\\times 10^{-2}\\text{ N/m}$）。',
        hint: '全部雨滴总表面积 $S_{\\text{总}} = \\frac{3V}{r}$，乘以 $\\alpha$ 即可！注意单位换算：$10\\text{ km}^2 = 10^7\\text{ m}^2$。',
        sol: '<p><strong>① 提取已知量与单位换算（注意 km² 和 mm！）：</strong></p><ul><li>湖面积 $S_{\\text{湖}} = 10\\text{ km}^2 = 10 \\times (10^3\\text{ m})^2 = 10^7\\text{ m}^2$；</li><li>降雨深度 $h = 25\\text{ mm} = 25\\times 10^{-3}\\text{ m} = 0.025\\text{ m}$；</li><li>雨滴<strong>直径</strong> $d = 1\\text{ mm} \\implies$ 半径 $r = 0.5\\text{ mm} = 5\\times 10^{-4}\\text{ m}$；水的 $\\alpha = 7.3\\times 10^{-2}\\text{ N/m}$。</li></ul><p><strong>② 解题思路：</strong>无数小雨滴落进大湖里后，湖面面积几乎没变，但<strong>所有小雨滴原本的表面积全部消失了</strong>，这部分消失的表面能 $\\Delta E = \\alpha S_{\\text{总}}$ 全部释放出来。</p><p><strong>③ 分步代入计算：</strong></p><ol><li><strong>算降雨总体积 $V$：</strong>$$V = S_{\\text{湖}} \\cdot h = 10^7 \\times 0.025 = 2.5\\times 10^5\\text{ m}^3$$</li><li><strong>算全部雨滴总表面积 $S_{\\text{总}}$（记住万能化简技巧！）：</strong>单个雨滴体积 $V_0 = \\frac{4}{3}\\pi r^3$，表面积 $S_0 = 4\\pi r^2$，雨滴个数 $N = \\frac{V}{V_0}$，所以：$$S_{\\text{总}} = N\\cdot S_0 = \\frac{V}{\\frac{4}{3}\\pi r^3}\\cdot 4\\pi r^2 = \\frac{3V}{r}$$（$4\\pi$ 和 $r^2$ 全约掉了！）代入数值：$$S_{\\text{总}} = \\frac{3 \\times 2.5\\times 10^5}{5\\times 10^{-4}} = \\frac{7.5\\times 10^5}{5\\times 10^{-4}} = 1.5\\times 10^9\\text{ m}^2$$</li><li><strong>算释放的能量 $\\Delta E$：</strong>$$\\Delta E = \\alpha S_{\\text{总}} = 7.3\\times 10^{-2} \\times 1.5\\times 10^9 = \\mathbf{1.095\\times 10^8\\text{ J}}\\ (\\approx 1.10\\times 10^8\\text{ J})$$</li></ol>'
      },
      {
        id: '3-3', ans: '水银面下降高度 $h \\approx 0.147\\text{ m}$（$14.7\\text{ cm}$）。', ch: '3', orig: '3-9', tag: '毛细现象 · 水银下降',
        stem: '将内径为 $d=10^{-4}\\text{ m}$ 的管子插入水银中，求水银面在管中下降的高度（水银完全不润湿管壁，$\\alpha=4.9\\times 10^{-1}\\text{ N/m}$）。',
        hint: '套用 $h = \\frac{2\\alpha\\cos\\theta}{\\rho g r}$，完全不润湿 $\\cos\\theta = -1$，$r = d/2 = 0.5\\times 10^{-4}\\text{ m}$。',
        sol: '<p><strong>① 提取已知量与单位换算：</strong></p><ul><li>管内<strong>直径</strong> $d = 10^{-4}\\text{ m} \\implies$ 半径 $r = \\frac{d}{2} = 0.5\\times 10^{-4}\\text{ m} = 5\\times 10^{-5}\\text{ m}$；</li><li>水银完全不润湿管壁 $\\implies$ 接触角 $\\theta = 180^\\circ$，故 $\\cos\\theta = -1$；</li><li>水银表面张力系数 $\\alpha = 4.9\\times 10^{-1} = 0.49\\text{ N/m}$；必背常数：水银密度 $\\rho_{\\text{Hg}} = 13.6\\times 10^3\\text{ kg/m}^3$。</li></ul><p><strong>② 分步代入毛细现象公式：</strong></p>$$h = \\frac{2\\alpha\\cos\\theta}{\\rho g r} = \\frac{2\\times 0.49\\times (-1)}{13.6\\times 10^3 \\times 9.8 \\times 5\\times 10^{-5}}$$<ol><li>算分子：$2\\times 0.49\\times (-1) = -0.98$；</li><li>算分母：$13.6\\times 10^3 \\times 5\\times 10^{-5} = 13.6\\times 5\\times 10^{-2} = 0.68$，再乘 $9.8$ 得 $0.68\\times 9.8 = 6.664$；</li><li>相除：$h = \\frac{-0.98}{6.664} \\approx \\mathbf{-0.147\\text{ m}}$。</li></ol><p><strong>③ 结论：</strong>负号表示管内液面比管外低，故水银面在管中下降 <strong>$0.147\\text{ m}$（$14.7\\text{ cm}$）</strong>。</p>'
      },
      {
        id: '3-4', ans: '管中所悬水柱高度 $h \\approx 5.46\\times 10^{-2}\\text{ m} = 5.46\\text{ cm}$。', ch: '3', orig: '3-10', tag: '双弯曲液面平衡',
        stem: '在半径 $r=0.3\\text{ mm}$ 的玻璃毛细管中注水一部分，下端形成半径 $R=3.0\\text{ mm}$ 的凸弧面，求管中所悬水柱的高度 $h$（$\\alpha=7.3\\times 10^{-2}\\text{ N/m}$，水完全润湿玻璃）。',
        hint: '上凹液面下方 $p_B = p_0 - \\frac{2\\alpha}{r}$，下凸液面上方 $p_A = p_0 + \\frac{2\\alpha}{R}$，由 $p_A - p_B = \\rho g h$ 求解。',
        sol: '<p><strong>① 提取已知量与单位换算：</strong></p><ul><li>玻璃管内半径 $r = 0.3\\text{ mm} = 3\\times 10^{-4}\\text{ m}$（水完全润湿，上凹液面曲率半径等于 $r$）；</li><li>下端凸弧面半径 $R = 3.0\\text{ mm} = 3\\times 10^{-3}\\text{ m}$；水的 $\\alpha = 7.3\\times 10^{-2}\\text{ N/m}$，$\\rho = 10^3\\text{ kg/m}^3$。</li></ul><p><strong>② 物理分析（哪边凹，哪边压强大！）：</strong></p><ol><li><strong>看上端凹液面（$B$ 点）</strong>：向上凹，空气在凹侧，所以液面正下方水中 $B$ 点压强<strong>小于</strong>大气压：$p_B = p_0 - \\frac{2\\alpha}{r}$；</li><li><strong>看下端凸液面（$A$ 点）</strong>：向下凸（圆心在水中），水在凹侧，所以液面正上方水中 $A$ 点压强<strong>大于</strong>大气压：$p_A = p_0 + \\frac{2\\alpha}{R}$；</li><li><strong>水柱静压强平衡</strong>：因为 $A$ 点在 $B$ 点下方深 $h$ 处，由 $p_A = p_B + \\rho g h$，得：$$p_A - p_B = \\left(p_0 + \\frac{2\\alpha}{R}\\right) - \\left(p_0 - \\frac{2\\alpha}{r}\\right) = 2\\alpha\\left(\\frac{1}{r} + \\frac{1}{R}\\right) = \\rho g h$$</li></ol><p><strong>③ 分步代入计算：</strong></p>$$h = \\frac{2\\alpha}{\\rho g}\\left(\\frac{1}{r} + \\frac{1}{R}\\right) = \\frac{2\\times 0.073}{10^3\\times 9.8}\\left(\\frac{1}{3\\times 10^{-4}} + \\frac{1}{3\\times 10^{-3}}\\right)$$括号里通分：$\\frac{10}{3\\times 10^{-3}} + \\frac{1}{3\\times 10^{-3}} = \\frac{11}{3\\times 10^{-3}} \\approx 3666.7\\text{ m}^{-1}$；前面 $\\frac{0.146}{9800} \\approx 1.4898\\times 10^{-5}\\text{ m}^2$；相乘得：$h \\approx 0.0546\\text{ m} = \\mathbf{5.46\\text{ cm}}$。'
      },
      {
        id: '3-5', ans: '两管水面高度差 $\\Delta h \\approx 1.99\\times 10^{-2}\\text{ m} \\approx 2.0\\text{ cm}$。', ch: '3', orig: '3-11', tag: 'U 形毛细管高度差',
        stem: '将 U 形管竖直放置并灌入水。两管内直径分别为 $10^{-3}\\text{ m}$ 和 $3\\times 10^{-3}\\text{ m}$，接触角为零，求两管水面高度差（$\\alpha=7.3\\times 10^{-2}\\text{ N/m}$）。',
        hint: '细管升得高，两管高度差 $\\Delta h = \\frac{2\\alpha}{\\rho g}(\\frac{1}{r_1} - \\frac{1}{r_2})$。',
        sol: '<p><strong>① 提取已知量与单位换算：</strong></p><ul><li>题目给的是两管<strong>内直径</strong>，先除以 2 变半径：$r_1 = \\frac{10^{-3}}{2} = 0.5\\times 10^{-3}\\text{ m}$，$r_2 = \\frac{3\\times 10^{-3}}{2} = 1.5\\times 10^{-3}\\text{ m}$；</li><li>接触角为零 $\\implies \\cos 0^\\circ = 1$；水的 $\\alpha = 7.3\\times 10^{-2}\\text{ N/m}$，$\\rho = 10^3\\text{ kg/m}^3$。</li></ul><p><strong>② 分步代入计算：</strong>细管上升高度 $h_1 = \\frac{2\\alpha}{\\rho g r_1}$，粗管上升高度 $h_2 = \\frac{2\\alpha}{\\rho g r_2}$，高度差为：</p>$$\\Delta h = h_1 - h_2 = \\frac{2\\alpha}{\\rho g}\\left(\\frac{1}{r_1} - \\frac{1}{r_2}\\right)$$<ol><li>先算括号内：$\\frac{1}{0.5\\times 10^{-3}} = 2000$，$\\frac{1}{1.5\\times 10^{-3}} = \\frac{2000}{3}$，相减得 $\\frac{4000}{3} \\approx 1333.3\\text{ m}^{-1}$；</li><li>再乘前面 $\\frac{2\\times 0.073}{10^3\\times 9.8} = \\frac{0.146}{9800}$：$$\\Delta h = \\frac{0.146}{9800}\\times\\frac{4000}{3} \\approx \\mathbf{1.99\\times 10^{-2}\\text{ m} \\approx 2.0\\text{ cm}}$$</li></ol>'
      },
      {
        id: '4-1', ans: '(1) $\\varphi_0 = \\frac{2\\pi}{3}$，$\\omega = \\pi\\text{ rad/s}$；(2) $y = 6\\cos(\\pi t + \\frac{2\\pi}{3})\\text{ m}$；(3) $\\varphi_a = \\pi$，$\\varphi_b = \\frac{5\\pi}{3}$；(4) $t_a = \\frac{1}{3}\\text{ s}$；(5) $\\Delta t = \\frac{2}{3}\\text{ s}$。', ch: '4', orig: '4-22', tag: '振动曲线 · 旋转矢量法',
        stem: '简谐振动曲线：$A=6\\text{ m}$，$T=2\\text{ s}$，$t=0$ 时 $y=-3\\text{ m}$ 且向下运动，$a$ 为波谷 $y=-6\\text{ m}$，$b$ 在 $t=1\\text{ s}$ 处（$y=+3\\text{ m}$ 向上运动）。求：(1) 初相与角频率；(2) 振动方程；(3) $a,b$ 相位；(4) $a$ 对应时刻；(5) $a$ 到 $b$ 所需时间。',
        hint: '$t=0$ 时 $y=-A/2$ 且向下（$v_0 &lt; 0$），旋转矢量在第二象限 $\\varphi_0 = 2\\pi/3$。去“物理直觉实验室”拖动初相到 $120^\\circ$ 亲自看看！',
        sol: '<p><strong>① 先从 $y-t$ 图上读出所有信息：</strong></p><ul><li>波峰/波谷高度 $\\implies$ 振幅 $A = 6\\text{ m}$；</li><li>$t=0$ 时 $y=-3\\text{ m}$（向下走），到 $t=2\\text{ s}$ 时再次回到 $y=-3\\text{ m}$（向下走）$\\implies$ 完整周期 $T = 2\\text{ s}$。</li></ul><p><strong>② 逐问保姆级求解：</strong></p><ol><li><strong>(1) 角频率 $\\omega$ 与初相 $\\varphi_0$：</strong>$\\omega = \\frac{2\\pi}{T} = \\frac{2\\pi}{2} = \\mathbf{\\pi\\text{ rad/s}}$。求初相看 $t=0$：$y_0 = A\\cos\\varphi_0 \\implies -3 = 6\\cos\\varphi_0 \\implies \\cos\\varphi_0 = -\\frac{1}{2}$。满足 $\\cos=-\\frac{1}{2}$ 的角有 $+\\frac{2\\pi}{3}$（上半圆）和 $-\\frac{2\\pi}{3}$（下半圆）；因为 $t=0$ 时曲线向下走（$v_0 &lt; 0$），记住铁律<strong>“向下选上半圆，向上选下半圆”</strong>，故 $\\mathbf{\\varphi_0 = \\frac{2\\pi}{3}}$。</li><li><strong>(2) 振动方程：</strong>把 $A=6, \\omega=\\pi, \\varphi_0=\\frac{2\\pi}{3}$ 填进 $y=A\\cos(\\omega t+\\varphi_0)$，得 $\\mathbf{y = 6\\cos\\left(\\pi t + \\frac{2\\pi}{3}\\right)\\text{ m}}$。</li><li><strong>(3) $a, b$ 两点相位：</strong>$a$ 点是波谷（$y=-6=-A$），旋转矢量逆时针从 $\\frac{2\\pi}{3}$ 转到负半轴 $\\mathbf{\\varphi_a = \\pi}$；$b$ 点在 $t=1\\text{ s}$ 处，直接代入相位公式 $\\varphi_b = \\omega t_b + \\varphi_0 = \\pi\\times 1 + \\frac{2\\pi}{3} = \\mathbf{\\frac{5\\pi}{3}}$。</li><li><strong>(4) $a$ 状态对应时刻：</strong>令 $\\pi t_a + \\frac{2\\pi}{3} = \\pi \\implies \\pi t_a = \\frac{\\pi}{3} \\implies \\mathbf{t_a = \\frac{1}{3}\\text{ s}}$。</li><li><strong>(5) 由 $a$ 到 $b$ 所需时间：</strong>旋转矢量从 $\\pi$ 逆时针转到 $\\frac{5\\pi}{3}$，转过角度 $\\Delta\\varphi = \\frac{5\\pi}{3} - \\pi = \\frac{2\\pi}{3}$，所以 $\\Delta t = \\frac{\\Delta\\varphi}{\\omega} = \\frac{2\\pi/3}{\\pi} = \\mathbf{\\frac{2}{3}\\text{ s}}$（也可验算 $t_b - t_a = 1 - \\frac{1}{3} = \\frac{2}{3}\\text{ s}$）。</li></ol>'
      },
      {
        id: '4-2', ans: '合振幅 $A \\approx 0.268\\text{ cm}$，合初相 $\\varphi \\approx 0.902\\text{ rad}\\ (51.7^\\circ)$，表达式 $y = 0.268\\cos(\\pi t + 0.902)\\text{ cm}$。', ch: '4', orig: '4-24', tag: '同方向同频率振动合成',
        stem: '两个同方向的简谐振动方程分别为 $y_1=0.12\\cos(\\pi t+\\pi/3)\\text{ cm}$ 和 $y_2=0.15\\cos(\\pi t+\\pi/4)\\text{ cm}$，求合振动的振幅、初相及表达式。',
        hint: '直接套用余弦定理求合振幅，用正切公式求合初相。',
        sol: '<p><strong>① 提取两个分振动的参数：</strong></p><ul><li>$y_1$：振幅 $A_1 = 0.12\\text{ cm}$，角频率 $\\omega = \\pi$，初相 $\\varphi_1 = \\frac{\\pi}{3} = 60^\\circ$；</li><li>$y_2$：振幅 $A_2 = 0.15\\text{ cm}$，角频率 $\\omega = \\pi$，初相 $\\varphi_2 = \\frac{\\pi}{4} = 45^\\circ$。</li></ul><p><strong>② 判断模型：</strong>两振动<strong>同方向、同频率</strong>（都是 $\\pi t$），合振动仍是频率为 $\\pi$ 的简谐振动，直接套旋转矢量合成公式！</p><p><strong>③ 分步代入计算：</strong></p><ol><li><strong>算合振幅 $A$（余弦定理）：</strong>初相差 $\\varphi_1 - \\varphi_2 = 60^\\circ - 45^\\circ = 15^\\circ$（$\\cos 15^\\circ \\approx 0.9659$）：$$A = \\sqrt{A_1^2 + A_2^2 + 2A_1 A_2\\cos(\\varphi_1-\\varphi_2)} = \\sqrt{0.12^2 + 0.15^2 + 2\\times 0.12\\times 0.15\\times 0.9659}$$算里面：$0.0144 + 0.0225 + 0.03477 = 0.07167$，开根号得 $A \\approx \\mathbf{0.268\\text{ cm}}$。</li><li><strong>算合初相 $\\varphi$（正切公式）：</strong>$$\\tan\\varphi = \\frac{A_1\\sin\\varphi_1 + A_2\\sin\\varphi_2}{A_1\\cos\\varphi_1 + A_2\\cos\\varphi_2} = \\frac{0.12\\times 0.8660 + 0.15\\times 0.7071}{0.12\\times 0.5 + 0.15\\times 0.7071} = \\frac{0.1039 + 0.1061}{0.06 + 0.1061} = \\frac{0.2100}{0.1661} \\approx 1.264$$分子分母都是正数（第一象限），查 $\\arctan(1.264) \\approx 51.7^\\circ \\approx \\mathbf{0.902\\text{ rad}}$。</li><li><strong>写出合振动方程：</strong>$\\mathbf{y = 0.268\\cos(\\pi t + 0.902)\\text{ cm}}$。</li></ol>'
      },
      {
        id: '4-3', ans: '(1) $\\varphi_0 = -\\frac{\\pi}{2}$；(2) $y_0(t) = 0.05\\cos(200\\pi t - \\frac{\\pi}{2})\\text{ m}$；(3) $y(x,t) = 0.05\\cos(200\\pi t - \\frac{\\pi}{2}x - \\frac{\\pi}{2})\\text{ m}$。', ch: '4', orig: '4-26', tag: '由振求波 · 波动方程',
        stem: '平面简谐波 $A=5\\text{ cm}$，$\\nu=100\\text{ Hz}$，$u=400\\text{ m/s}$，沿 $+x$ 传播，以波源在平衡位置且正向 $+y$ 运动为计时起点，求：(1) 波源初相；(2) 波源振动方程；(3) 波动方程。',
        hint: '$t=0$ 时 $y_0=0, v_0 &gt; 0$ 选下半圆 $\\varphi_0 = -\\pi/2$；沿 $+x$ 传播把 $t$ 换成 $t - x/u$。',
        sol: '<p><strong>① 提取已知量与单位换算：</strong></p><ul><li>振幅 $A = 5\\text{ cm} = 0.05\\text{ m}$；频率 $\\nu = 100\\text{ Hz}$；波速 $u = 400\\text{ m/s}$；沿 $+x$ 正方向传播；</li><li>先算角频率 $\\omega = 2\\pi\\nu = 2\\pi\\times 100 = 200\\pi\\text{ rad/s}$；波长 $\\lambda = \\frac{u}{\\nu} = \\frac{400}{100} = 4\\text{ m}$。</li></ul><p><strong>② 逐问求解：</strong></p><ol><li><strong>(1) 波源初相 $\\varphi_0$：</strong>计时起点 $t=0$ 时在平衡位置（$y_0=0 \\implies \\cos\\varphi_0=0$）且向 $+y$ <strong>向上</strong>运动（$v_0 &gt; 0$）。套口诀“向上选下半圆”，下半圆满足 $\\cos=0$ 的角是 $\\mathbf{\\varphi_0 = -\\frac{\\pi}{2}}$。</li><li><strong>(2) 波源振动方程：</strong>$\\mathbf{y_0(t) = 0.05\\cos\\left(200\\pi t - \\frac{\\pi}{2}\\right)\\text{ m}}$（写 $5\\cos(200\\pi t-\\frac{\\pi}{2})\\text{ cm}$ 也可以）。</li><li><strong>(3) 波动方程：</strong>波沿 $+x$ 正方向传播，右边的点比原点晚 $x/u$ 秒，所以把上式里的 $t$ 替换成 $\\left(t - \\frac{x}{400}\\right)$：$$y(x,t) = 0.05\\cos\\left[200\\pi\\left(t - \\frac{x}{400}\\right) - \\frac{\\pi}{2}\\right] = \\mathbf{0.05\\cos\\left(200\\pi t - \\frac{\\pi}{2}x - \\frac{\\pi}{2}\\right)\\text{ m}}$$</li></ol>'
      },
      {
        id: '4-4', ans: '(1) $y_O(t)=0.04\\cos(0.4\\pi t+\\frac{\\pi}{2})\\text{ m}$；(2) $y(x,t)=0.04\\cos(0.4\\pi t-5\\pi x+\\frac{\\pi}{2})\\text{ m}$；(3) $a$ 向下、$b$ 向上、$P$ 向下；(4) $y_P(t)=0.04\\cos(0.4\\pi t+\\frac{\\pi}{2})\\text{ m}$；(5) 从原点向下的负正弦曲线（$T=5\\text{ s}$）；(6) $y=0.04\\cos(5\\pi x)$（右移 $0.3\\text{ m}$）。', ch: '4', orig: '4-28', tag: '波形图 · 质点运动方向',
        stem: '$t=0$ 时刻波形：$A=0.04\\text{ m}$，$\\lambda=0.4\\text{ m}$，$u=0.08\\text{ m/s}$ 向右传播，$x=0$ 处 $y=0$，$x=0.1\\text{ m}$ 为波峰，$x=0.4\\text{ m}$ 为 $P$ 点；$a$ 在上升段 $0 &lt; x &lt; 0.1$，$b$ 在下降段 $0.1 &lt; x &lt; 0.2$。求：(1) $O$ 点振动方程；(2) 波函数；(3) $a,b,P$ 运动方向；(4) $P$ 点振动方程；(5) $P$ 点振动图线；(6) $t=3T/4$ 波形。',
        hint: '记住波向右传的口诀：<strong>上坡下、下坡上</strong>！所以 $O$ 点向下动，$\\varphi_O = +\\pi/2$。',
        sol: '<p><strong>① 先算基本量：</strong>由波形图读出 $A = 0.04\\text{ m}$，$\\lambda = 0.4\\text{ m}$，波速 $u = 0.08\\text{ m/s}$（向右）。所以周期 $T = \\frac{\\lambda}{u} = \\frac{0.4}{0.08} = 5\\text{ s}$，角频率 $\\omega = \\frac{2\\pi}{T} = \\frac{2\\pi}{5} = 0.4\\pi\\text{ rad/s}$。</p><p><strong>② 逐问保姆级求解：</strong></p><ol><li><strong>(1) $O$ 点振动方程：</strong>$t=0$ 时 $O$ 点在 $y=0$。波向右传，套口诀<strong>“上坡下、下坡上”</strong>：$O$ 点在从 $0$ 往波峰爬的上坡段，所以 $O$ 点正在<strong>向下</strong>运动（$v_O &lt; 0$）！向下选上半圆 $\\implies \\varphi_O = +\\frac{\\pi}{2}$，故 $\\mathbf{y_O(t) = 0.04\\cos\\left(0.4\\pi t + \\frac{\\pi}{2}\\right)\\text{ m}}$。</li><li><strong>(2) 波函数：</strong>波沿 $+x$ 传，把 $t$ 换成 $t - \\frac{x}{0.08}$：$0.4\\pi\\times\\frac{x}{0.08} = 5\\pi x$，得 $\\mathbf{y(x,t) = 0.04\\cos\\left(0.4\\pi t - 5\\pi x + \\frac{\\pi}{2}\\right)\\text{ m}}$。（验证 $t=0$ 时 $\\cos(\\frac{\\pi}{2}-5\\pi x)=\\sin(5\\pi x)$，与原图完美吻合！）</li><li><strong>(3) $a, b, P$ 运动方向：</strong>继续用“上坡下、下坡上”：$a$ 在上坡段 $\\implies$ <strong>向下</strong>；$b$ 在下坡段 $\\implies$ <strong>向上</strong>；$P$ 在 $x=0.4\\text{ m}=\\lambda$（与 $O$ 相隔一个整波长，状态完全一样，在上坡段）$\\implies$ <strong>向下</strong>。</li><li><strong>(4) $P$ 点振动方程：</strong>把 $x=0.4\\text{ m}$ 代入波函数：$5\\pi\\times 0.4 = 2\\pi$（减去 $2\\pi$ 不变），得 $\\mathbf{y_P(t) = 0.04\\cos\\left(0.4\\pi t + \\frac{\\pi}{2}\\right)\\text{ m}}$。</li><li><strong>(5) $P$ 点振动图线：</strong>横轴画时间 $t$（一个周期 $5\\text{ s}$），纵轴画位移 $y$（振幅 $0.04\\text{ m}$），因为 $t=0$ 时 $y=0$ 且向下走，从原点向下方画一条负正弦曲线（$t=1.25\\text{ s}$ 到波谷 $-0.04$）。</li><li><strong>(6) $t=\\frac{3}{4}T$ 时刻波形：</strong>波经过 $\\frac{3}{4}T$ 会向右平移 $\\frac{3}{4}\\lambda = 0.3\\text{ m}$（或直接把 $t=3.75\\text{ s}$ 代入波函数得 $y = 0.04\\cos(2\\pi - 5\\pi x) = 0.04\\cos(5\\pi x)$），即从 $x=0$ 处为波峰 $+0.04\\text{ m}$ 开始画标准余弦波。</li></ol>'
      },
      {
        id: '4-5', ans: '弯道与直管最小长度差 $\\Delta l_{\\min} = \\frac{17}{30}\\text{ m} \\approx 0.567\\text{ m}$。', ch: '4', orig: '4-29', tag: '声波干涉相消',
        stem: '干涉型消音器中，声波在 $A$ 点分两路在 $B$ 点干涉相消。要消除 $300\\text{ Hz}$ 噪声，求弯道与直管最小长度差（声速 $340\\text{ m/s}$）。',
        hint: '同相分出，干涉相消最小路程差就是半个波长 $\\lambda/2$。',
        sol: '<p><strong>① 提取已知量：</strong>噪声频率 $\\nu = 300\\text{ Hz}$，声波波速 $u = 340\\text{ m/s}$。</p><p><strong>② 解题思路：</strong>声波在 $A$ 点分成两路（初相相同），在 $B$ 点相遇要“互相抵消（干涉相消）”，波程差必须是半波长的奇数倍：$\\Delta l = (2k+1)\\frac{\\lambda}{2}$。题目问“<strong>至少</strong>相差多少”，就是取最小的 $k=0$，即<strong>半个波长 $\\frac{\\lambda}{2}$</strong>！</p><p><strong>③ 分步计算：</strong></p><ol><li>先算波长：$\\lambda = \\frac{u}{\\nu} = \\frac{340}{300} = \\frac{17}{15}\\text{ m}$；</li><li>除以 2 得最小长度差：$\\Delta l_{\\min} = \\frac{\\lambda}{2} = \\frac{17}{30}\\text{ m} \\approx \\mathbf{0.567\\text{ m}}$。</li></ol>'
      },
      {
        id: '5-1', ans: '$E = \\frac{\\lambda}{8\\pi\\varepsilon_0 L}$，方向沿直棒延长线向右。', ch: '5', orig: '5-12', tag: '带电直棒延长线积分',
        stem: '正电荷均匀分布在长 $L$、线密度 $\\lambda$ 的直棒上，求右侧延长线上距右端 $L$ 处 $P$ 点的电场强度。',
        hint: '以 $P$ 为原点向左建坐标 $r\\in[L,2L]$，对 $\\frac{\\lambda\\,dr}{4\\pi\\varepsilon_0 r^2}$ 积分。',
        sol: '<p><strong>① 为什么不能直接套点电荷公式？</strong>因为电荷分布在一条长 $L$ 的直棒上，棒上不同位置到 $P$ 点的距离不一样（近端距 $P$ 为 $L$，远端距 $P$ 为 $2L$），所以必须把直棒切成无数小段 $dr$，算出每小段在 $P$ 点的场强 $dE$，再用定积分全部加起来。</p><p><strong>② 分步推导：</strong></p><ol><li><strong>建坐标系：</strong>以 $P$ 点为原点，向左为 $r$ 轴正方向，则直棒占据区间 $r \\in [L, 2L]$。</li><li><strong>取电荷微元：</strong>在距 $P$ 点 $r$ 处取一小段 $dr$，它带的电量是 $dq = \\lambda\\,dr$。</li><li><strong>写微元场强：</strong>因为直棒带正电，所有小段在 $P$ 点产生的电场方向都<strong>水平向右</strong>，直接代数相加（积分）：$$E = \\int_L^{2L} \\frac{dq}{4\\pi\\varepsilon_0 r^2} = \\frac{\\lambda}{4\\pi\\varepsilon_0}\\int_L^{2L} r^{-2}\\,dr$$</li><li><strong>算定积分：</strong>记住 $\\int r^{-2}\\,dr = -\\frac{1}{r}$，代入上下限 $2L$ 和 $L$：$$E = \\frac{\\lambda}{4\\pi\\varepsilon_0}\\left[-\\frac{1}{r}\\right]_L^{2L} = \\frac{\\lambda}{4\\pi\\varepsilon_0}\\left(-\\frac{1}{2L} + \\frac{1}{L}\\right) = \\mathbf{\\frac{\\lambda}{8\\pi\\varepsilon_0 L}}$$</li></ol><p><strong>③ 写方向：</strong>沿直棒延长线<strong>向右</strong>。</p>'
      },
      {
        id: '5-2', ans: '$E = \\frac{\\lambda}{2\\pi\\varepsilon_0 R}$，方向水平向右（由正电半环指向负电半环）。', ch: '5', orig: '5-13', tag: '对称性 · 半圆环积分',
        stem: '半径为 $R$ 的上半圆环，左半环均匀带正电 $+\\lambda$，右半环均匀带负电 $-\\lambda$，求圆心 $O$ 处电场强度。',
        hint: '竖直分量抵消，水平分量向右叠加！两半环贡献相等，算一半再乘 2。',
        sol: '<p><strong>① 先用对称性简化方向（核心技巧！）：</strong></p><ul><li>左半环带正电 $+\\lambda$，对圆心 $O$ 是“推力”，产生的场强指向<strong>右下方</strong>；</li><li>右半环带负电 $-\\lambda$，对圆心 $O$ 是“吸力”，产生的场强指向<strong>右上方</strong>；</li><li>左右对称、电量大小相等，所以<strong>向下的竖直分量和向上的竖直分量正好抵消为 0</strong>，只剩下两个<strong>水平向右</strong>的分量叠加，而且左右贡献完全相等（算一半乘 2 就行）！</li></ul><p><strong>② 分步积分：</strong></p><ol><li>以竖直向上为 $0^\\circ$，从顶部向左量角 $\\theta \\in [0, \\frac{\\pi}{2}]$，弧长微元 $dl = R\\,d\\theta$，电量 $dq = \\lambda R\\,d\\theta$。</li><li>该微元在圆心产生的场强大小 $dE = \\frac{\\lambda R\\,d\\theta}{4\\pi\\varepsilon_0 R^2} = \\frac{\\lambda\\,d\\theta}{4\\pi\\varepsilon_0 R}$，它的水平向右分量是 $dE_x = dE\\sin\\theta$。</li><li>把左半环积分再乘以 2（加上右半环）：$$E = 2\\int_0^{\\pi/2} \\frac{\\lambda}{4\\pi\\varepsilon_0 R}\\sin\\theta\\,d\\theta = \\frac{\\lambda}{2\\pi\\varepsilon_0 R}\\Big[-\\cos\\theta\\Big]_0^{\\pi/2} = \\frac{\\lambda}{2\\pi\\varepsilon_0 R}(0 - (-1)) = \\mathbf{\\frac{\\lambda}{2\\pi\\varepsilon_0 R}}$$</li></ol><p><strong>③ 写方向：</strong><strong>水平向右</strong>（由正电半环指向负电半环）。</p>'
      },
      {
        id: '5-3', ans: '$\\Phi_1 = ba^3$，$\\Phi_2 = 0$，立方体内净电量 $Q = \\varepsilon_0 ba^3$。', ch: '5', orig: '5-14', tag: '电通量 · 高斯定理', hasErr: true,
        stem: '真空中静电场 $\\mathbf{E}=bx\\mathbf{i}$，边长 $a$ 的立方体（左面 $x=0$，右面 $S_1$ 在 $x=a$），求通过 $S_1$ 的电通量 $\\Phi_1$、上表面 $S_2$ 的电通量 $\\Phi_2$ 及内部净电量 $Q$。',
        hint: '只有右面 $S_1$ 有通量（$E=ba$ 乘以面积 $a^2$），其余 5 个面通量全为 0。',
        sol: '<p><strong>① 读懂电场表达式：</strong>$\\mathbf{E} = bx\\mathbf{i}$ 表示电场方向永远沿着 $+x$ 轴（水平向右），但大小随位置 $x$ 变大（$x=0$ 处场强为 $0$，$x=a$ 处场强为 $ba$）。</p><p><strong>② 逐个面算电通量（$\\Phi = E S \\cos\\theta$）：</strong></p><ol><li><strong>右侧面 $S_1$（位于 $x=a$）：</strong>外法向向右（与 $\\mathbf{E}$ 同向，$\\cos 0^\\circ=1$），面积 $S_1 = a^2$，当地场强 $E = ba$，故：$$\\Phi_1 = E \\cdot S_1 = (ba)\\cdot a^2 = \\mathbf{ba^3}$$</li><li><strong>上表面 $S_2$：</strong>外法向竖直向上，与水平向右的 $\\mathbf{E}$ 垂直（$\\cos 90^\\circ = 0$），故 $\\mathbf{\\Phi_2 = 0}$。</li><li><strong>其余 4 个面：</strong>下、前、后三个面都与 $\\mathbf{E}$ 垂直（通量为 0）；左侧面在 $x=0$ 处，场强 $E = b\\times 0 = 0$（通量也为 0）。</li><li><strong>用高斯定理求内部净电量 $Q$：</strong>总电通量 $\\Phi = \\Phi_1 = ba^3$，由 $\\Phi = \\frac{Q}{\\varepsilon_0}$ 得：$$\\mathbf{Q = \\varepsilon_0 \\Phi = \\varepsilon_0 ba^3}$$</li></ol>',
        errNote: '⚠️ 你的手写稿末行笔误写成了 $\\varepsilon_0 ba^2$，正确结果是 $\\varepsilon_0 ba^3$，考试千万别丢指数！'
      },
      {
        id: '5-4', ans: '$E_1 = 0$；$E_2 = 2.25\\times 10^3\\text{ N/C}$（径向向外）；$E_3 = 9.0\\times 10^2\\text{ N/C}$（径向向外）。', ch: '5', orig: '5-15', tag: '同心球壳 · 高斯定理',
        stem: '两个均匀带电同心球面 $R_1=0.10\\text{ m}, R_2=0.30\\text{ m}$，$q_1=1.0\\times 10^{-8}\\text{ C}, q_2=1.5\\times 10^{-8}\\text{ C}$。求 $r_1=0.05\\text{ m}, r_2=0.20\\text{ m}, r_3=0.50\\text{ m}$ 处场强。',
        hint: '看半径为 $r$ 的高斯球面“包住了多少电荷”，套 $E = k q_{\\text{内}}/r^2$。',
        sol: '<p><strong>① 识别模型：</strong>两个均匀带电同心球面是完美的<strong>球对称</strong>，闭眼套高斯定理：$E = \\frac{q_{\\text{内}}}{4\\pi\\varepsilon_0 r^2} = k\\frac{q_{\\text{内}}}{r^2}$（其中 $k=9.0\\times 10^9\\text{ N}\\cdot\\text{m}^2/\\text{C}^2$），关键是看半径为 $r$ 的高斯球面<strong>里面包住了多少电荷</strong>！</p><p><strong>② 逐点分步计算：</strong></p><ol><li><strong>$r_1 = 0.05\\text{ m} &lt; R_1(0.10\\text{ m})$（在内球里面）：</strong>高斯球面内没有任何电荷（$q_{\\text{内}} = 0$），所以 $\\mathbf{E_1 = 0}$。</li><li><strong>$R_1 &lt; r_2 = 0.20\\text{ m} &lt; R_2(0.30\\text{ m})$（两球之间）：</strong>只包住了内球电量 $q_{\\text{内}} = q_1 = 1.0\\times 10^{-8}\\text{ C}$：$$E_2 = \\frac{9.0\\times 10^9 \\times 1.0\\times 10^{-8}}{(0.20)^2} = \\frac{90}{0.04} = \\mathbf{2.25\\times 10^3\\text{ N/C}}\\text{（径向向外）}$$</li><li><strong>$r_3 = 0.50\\text{ m} &gt; R_2$（外球外面）：</strong>内外两球都被包住了，$q_{\\text{内}} = q_1 + q_2 = 1.0\\times 10^{-8} + 1.5\\times 10^{-8} = 2.5\\times 10^{-8}\\text{ C}$：$$E_3 = \\frac{9.0\\times 10^9 \\times 2.5\\times 10^{-8}}{(0.50)^2} = \\frac{225}{0.25} = \\mathbf{9.0\\times 10^2\\text{ N/C}}\\text{（径向向外）}$$</li></ol>'
      },
      {
        id: '5-5', ans: '板间电场强度 $E = \\frac{\\sigma}{2\\varepsilon_0}$（方向由 $+2\\sigma$ 板指向 $+\\sigma$ 板）。', ch: '5', orig: '5-17', tag: '无限大带电平板叠加',
        stem: '真空中两块互相平行的无限大均匀带电平板，电荷面密度分别为 $+\\sigma$ 和 $+2\\sigma$，求板间电场强度大小。',
        hint: '单板场强 $\\frac{\\sigma}{2\\varepsilon_0}$，两块正电板在板间场强反向相减。',
        sol: '<p><strong>① 记住单板结论：</strong>一块无限大均匀带电平板在周围产生的场强大小处处为 $E = \\frac{\\sigma}{2\\varepsilon_0}$（与距离无关），正电荷板场强方向<strong>背离平板向外</strong>。</p><p><strong>② 画方向叠加（设左板 $+\\sigma$，右板 $+2\\sigma$）：</strong></p><ul><li>在两板之间的区域，左板（$+\\sigma$）产生的场强 $E_1 = \\frac{\\sigma}{2\\varepsilon_0}$ <strong>指向右</strong>；</li><li>右板（$+2\\sigma$）产生的场强 $E_2 = \\frac{2\\sigma}{2\\varepsilon_0}$ <strong>指向左</strong>；</li><li>两矢量方向相反，大减小：$$E = E_2 - E_1 = \\frac{2\\sigma}{2\\varepsilon_0} - \\frac{\\sigma}{2\\varepsilon_0} = \\mathbf{\\frac{\\sigma}{2\\varepsilon_0}}$$</li></ul><p><strong>③ 方向：</strong>由电荷密度大的 $+2\\sigma$ 板指向 $+\\sigma$ 板。</p>'
      },
      {
        id: '5-6', ans: '圆环中心电势 $U = \\frac{\\lambda}{2\\varepsilon_0}$。', ch: '5', orig: '5-18', tag: '电势标量叠加',
        stem: '半径为 $R$ 的均匀带电圆环，电荷线密度为 $\\lambda$，无穷远电势为零，求圆心处电势。',
        hint: '电势是标量！所有电荷到圆心距离都是 $R$，直接 $U = Q/(4\\pi\\varepsilon_0 R)$。',
        sol: '<p><strong>① 记住电势的最大优点：</strong>电势 $U$ 是<strong>标量（纯数字，没有方向）</strong>，点电荷电势是 $U = \\frac{q}{4\\pi\\varepsilon_0 r}$。</p><p><strong>② 分步计算：</strong></p><ol><li>圆环上任意一小段电荷 $dq$ 到圆心的距离都一模一样，全等于半径 $R$；</li><li>把整圈电荷全加起来，总电量 $Q = \\lambda \\times \\text{圆周长} = \\lambda \\cdot 2\\pi R$；</li><li>代入公式约分：$$U = \\oint \\frac{dq}{4\\pi\\varepsilon_0 R} = \\frac{Q}{4\\pi\\varepsilon_0 R} = \\frac{\\lambda \\cdot 2\\pi R}{4\\pi\\varepsilon_0 R} = \\mathbf{\\frac{\\lambda}{2\\varepsilon_0}}$$</li></ol><p><strong>③ 对比记忆：</strong>均匀带电圆环圆心处<strong>场强 $E = 0$</strong>（矢量对称抵消），但<strong>电势 $U = \\frac{\\lambda}{2\\varepsilon_0} \\ne 0$</strong>（标量不抵消）！</p>'
      },
      {
        id: '6-1', ans: '$\\Phi = \\frac{\\mu_0 Ia}{2\\pi}(2\\ln 2 - 1)$，方向垂直纸面向里。', ch: '6', orig: '6-14', tag: '非均匀磁场 · 磁通量积分',
        stem: '载有电流 $I$ 的无限长直导线旁有共面等腰直角三角形回路 $MNO$，$MN$ 平行导线相距 $a$，$MN=MO=a$，求通过回路的磁通量。',
        hint: '在 $x\\in[a,2a]$ 处切竖直窄条，高度 $h(x)=2a-x$，乘以 $B=\\frac{\\mu_0 I}{2\\pi x}$ 积分。',
        sol: '<p><strong>① 为什么必须积分？</strong>长直导线右侧的磁场 $B(x) = \\frac{\\mu_0 I}{2\\pi x}$ 随着离导线距离 $x$ 变大而变弱（不均匀），所以要把等腰直角三角形切成一条条竖直细长条再积分。</p><p><strong>② 找窄条的高度 $h(x)$（几何关键！）：</strong></p><ul><li>直导线在 $x=0$，三角形竖直边 $MN$ 在 $x=a$（高为 $a$），最右顶点 $O$ 在 $x=2a$（高为 $0$）；</li><li>在任意位置 $x \\in [a, 2a]$，由于是等腰直角三角形（$45^\\circ$ 斜边），竖直窄条高度 $h(x) = 2a - x$（检查：$x=a$ 时高 $a$，$x=2a$ 时高 $0$，完全正确！），面积微元 $dS = (2a-x)\\,dx$。</li></ul><p><strong>③ 分步算定积分：</strong></p>$$\\Phi = \\int_a^{2a} \\frac{\\mu_0 I}{2\\pi x}(2a - x)\\,dx = \\frac{\\mu_0 I}{2\\pi}\\int_a^{2a}\\left(\\frac{2a}{x} - 1\\right)dx$$利用 $\\int\\frac{1}{x}dx = \\ln x$ 和 $\\int 1\\,dx = x$：$$\\Phi = \\frac{\\mu_0 I}{2\\pi}\\Big[2a\\ln x - x\\Big]_a^{2a} = \\frac{\\mu_0 I}{2\\pi}\\Big[(2a\\ln 2a - 2a) - (2a\\ln a - a)\\Big] = \\mathbf{\\frac{\\mu_0 I a}{2\\pi}(2\\ln 2 - 1)}$$<p><strong>④ 方向：</strong>右手大拇指顺着电流向上，右侧四指指向纸面内 $\\implies$ <strong>垂直纸面向里</strong>。</p>'
      },
      {
        id: '6-2', ans: '$B = \\frac{\\mu_0 I}{4\\pi R}(1 + \\frac{\\pi}{2}) \\approx 5.14\\times 10^{-5}\\text{ T}$，方向垂直纸面向里。', ch: '6', orig: '6-16', tag: '毕奥-萨伐尔 · 分段叠加',
        stem: '无限长直导线弯成：半无限长直导线 $ab$ + 半径 $R=5\\text{ cm}$ 的四分之一圆弧 $bc$ + 延长线过圆心 $O$ 的半无限长直导线 $cd$，电流 $I=10\\text{ A}$，求 $O$ 点磁感应强度。',
        hint: '三段分别算：$ab$ 贡献 $\\frac{\\mu_0 I}{4\\pi R}$，$bc$ 贡献 $\\frac{\\mu_0 I}{8R}$，$cd$ 延长线过 $O$ 贡献 0。',
        sol: '<p><strong>① 拆段法（遇到折弯导线永远拆成“直段 + 圆弧段”）：</strong>把整根导线拆成 3 段，已知 $I=10\\text{ A}$，$R=5\\text{ cm}=0.05\\text{ m}$，记住 $\\frac{\\mu_0}{4\\pi}=10^{-7}$。</p><p><strong>② 逐段算大小与方向（右手螺旋定则）：</strong></p><ol><li><strong>半无限长直导线 $ab$：</strong>$O$ 点在 $b$ 正下方距离 $R$ 处，半无限长直导线公式：$B_1 = \\frac{\\mu_0 I}{4\\pi R}$，方向<strong>垂直纸面向里</strong>；</li><li><strong>四分之一圆弧 $bc$：</strong>整圆是 $\\frac{\\mu_0 I}{2R}$，四分之一圆乘 $\\frac{1}{4}$：$B_2 = \\frac{1}{4}\\cdot\\frac{\\mu_0 I}{2R} = \\frac{\\mu_0 I}{8R}$，顺时针电流在圆心方向也是<strong>垂直纸面向里</strong>；</li><li><strong>半无限长直导线 $cd$：</strong>它的反向延长线正好穿过 $O$ 点，延长线上磁场恒为 $\\mathbf{B_3 = 0}$！</li></ol><p><strong>③ 同向相加代入数值：</strong></p>$$B = B_1 + B_2 = \\frac{\\mu_0 I}{4\\pi R}\\left(1 + \\frac{\\pi}{2}\\right) = \\frac{10^{-7}\\times 10}{0.05}\\times(1 + 1.5708) = 2\\times 10^{-5}\\times 2.5708 \\approx \\mathbf{5.14\\times 10^{-5}\\text{ T}}$$<p>方向：<strong>垂直纸面向里</strong>。</p>'
      },
      {
        id: '6-3', ans: '最大位置在圆柱导体表面 $r = R = 2\\text{ cm}$ 处；最大值 $B_{\\max} = 1.0\\times 10^{-4}\\text{ T}$。', ch: '6', orig: '6-19', tag: '安培环路定理 · 圆柱导体', hasErr: true,
        stem: '真空中 $10\\text{ A}$ 电流均匀流过极长圆柱形导体（直径 $d=4\\text{ cm}$），求磁感应强度最大的位置及最大值。',
        hint: '柱内 $B\\propto r$，柱外 $B\\propto 1/r$，故在圆柱表面 $r=R=0.02\\text{ m}$ 最大！注意 $\\frac{\\mu_0}{2\\pi}=2\\times 10^{-7}$。',
        sol: '<p><strong>① 提取已知量（防直径坑！）：</strong>电流 $I = 10\\text{ A}$；导体横截面<strong>直径</strong> $d = 4\\text{ cm} \\implies$ 半径 $R = \\frac{d}{2} = 2\\text{ cm} = 0.02\\text{ m}$。</p><p><strong>② 用安培环路定理看磁场怎么变化：</strong></p><ul><li><strong>圆柱内部（$r \\le R$）</strong>：$B = \\frac{\\mu_0 I r}{2\\pi R^2}$，随 $r$ 增大而<strong>线性变大</strong>；</li><li><strong>圆柱外部（$r \\ge R$）</strong>：$B = \\frac{\\mu_0 I}{2\\pi r}$，随 $r$ 增大而<strong>反比变小</strong>；</li><li>所以先增后减，最高峰就在交界处——<strong>圆柱导体表面 $r = R = 2\\text{ cm}$ 处</strong>！</li></ul><p><strong>③ 算最大值（牢记 $\\frac{\\mu_0}{2\\pi} = 2\\times 10^{-7}$）：</strong></p>$$B_{\\max} = \\frac{\\mu_0 I}{2\\pi R} = \\frac{4\\pi\\times 10^{-7}\\times 10}{2\\pi\\times 0.02} = \\frac{2\\times 10^{-6}}{0.02} = \\mathbf{1.0\\times 10^{-4}\\text{ T}}$$',
        errNote: '⚠️ 你提交的第六章作业误算成了 $5\\times 10^{-5}\\text{ T}$（直径当半径或漏了 2 倍），正确答案是 $1.0\\times 10^{-4}\\text{ T}$！'
      },
      {
        id: '6-4', ans: '运动电荷为<strong>负电荷（自由电子）</strong>。', ch: '6', orig: '6-20', tag: '霍尔效应 · 载流子电性',
        stem: '载流体横截面中电流垂直纸面向外，加铅直向上磁场 $\\vec{B}$，左侧堆积负电荷、右侧堆积正电荷，问运动电荷的性质。',

        sol: '<p><strong>① 解题两步走：</strong>电流 $I = I_0 + kt$ 随时间变化 $\\implies$ 属于<strong>感生电动势</strong>！固定套路：<strong>第 1 步先积分求 $\\Phi(t)$，第 2 步对 $t$ 求导得 $\\mathcal{E}$</strong>。</p><p><strong>② 分步推导：</strong></p><ol><li><strong>求任意时刻 $t$ 穿过矩形框的磁通量 $\\Phi(t)$：</strong>取垂直纸面向里为正。在距导线 $x \\in [l, l+a]$ 处切宽 $dx$、高 $b$ 的竖直窄条（$dS = b\\,dx$），当地磁场 $B(x,t) = \\frac{\\mu_0 I}{2\\pi x}$：$$\\Phi(t) = \\int_l^{l+a} \\frac{\\mu_0 I}{2\\pi x}\\cdot b\\,dx = \\frac{\\mu_0 b (I_0 + kt)}{2\\pi}\\Big[\\ln x\\Big]_l^{l+a} = \\frac{\\mu_0 b (I_0 + kt)}{2\\pi}\\ln\\frac{l+a}{l}$$</li><li><strong>套法拉第定律对 $t$ 求导：</strong>注意 $I_0$ 是常数求导为 $0$，$kt$ 对 $t$ 求导只剩 $k$：$$\\mathcal{E} = -\\frac{d\\Phi}{dt} = -\\frac{\\mu_0 k b}{2\\pi}\\ln\\frac{l+a}{l}$$故感应电动势大小：$$\\mathbf{\\mathcal{E} = \\frac{\\mu_0 k b}{2\\pi}\\ln\\left(1 + \\frac{a}{l}\\right)}$$</li><li><strong>楞次定律判方向：</strong>$PQ$ 电流向上 $\\implies$ 右侧线框内原磁场<strong>向里</strong>；$k &gt; 0$ 说明电流增大 $\\implies$ 向里磁通量<strong>增大</strong>；线框反抗它，感应磁场必须<strong>向外</strong>；右手大拇指指向纸外，四指卷向<strong>逆时针</strong>（$A\\to D\\to C\\to B\\to A$）！</li></ol>'

    const ALL_PROBLEMS = [
      ...PROBLEMS.map(p => ({ ...p, src: 'orig' })),
      ...EXTRA_PROBLEMS
    ].sort((a, b) => Number(a.ch) - Number(b.ch) || (a.src === 'orig' ? -1 : 1));

    const STORE_KEY = 'u_physics_review_state_v1';
    let state = JSON.parse(localStorage.getItem(STORE_KEY) || '{"mastered":{},"starred":{},"days":{},"dark":false}');
    let srcFilter = 'all';
    let chFilter = 'all';
    let allAnsOpen = false;
    let allSolOpen = false;

    function saveState() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      updateProgress();
    }

    function updateProgress() {
      const m = ALL_PROBLEMS.filter(p => state.mastered[p.id]).length;
      const pct = Math.round((m / ALL_PROBLEMS.length) * 100);
      document.getElementById('progText').textContent = `${m} / ${ALL_PROBLEMS.length} (${pct}%)`;
      document.getElementById('progFill').style.width = `${pct}%`;
    }

    function renderMath(el) {
      if (window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false
        });
      }
    }

    function render() {
      const filtered = ALL_PROBLEMS.filter(p => {
        if (chFilter !== 'all' && p.ch !== chFilter) return false;
        if (srcFilter === 'orig') return p.src === 'orig';
        if (srcFilter === 'extra') return p.src === 'extra';
        if (srcFilter === 'starred') return !!state.starred[p.id];
        if (srcFilter === 'unmastered') return !state.mastered[p.id];
        return true;
      });
      document.getElementById('countInfo').textContent = `当前显示：${filtered.length} 题`;
      const box = document.getElementById('list');
      if (!filtered.length) {
        box.innerHTML = '<div class="problem-card" style="text-align:center;color:var(--muted);">当前筛选下暂无题目 🎉</div>';
        return;
      }
      box.innerHTML = filtered.map((p, i) => {
        const m = !!state.mastered[p.id];
        const s = !!state.starred[p.id];
        const srcBadge = p.src === 'orig'
          ? '<span class="badge">学习通原题</span>'
          : '<span class="badge badge-extra">期末拓展精选</span>';
        return `
          <div class="problem-card ${m ? 'mastered' : ''} ${s ? 'starred' : ''}">
            <div class="p-top">
              <span class="p-title">#${i + 1} · 第 ${p.ch} 章（${p.orig}）</span>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${srcBadge}
                <span class="badge">${p.tag}</span>
                ${p.hasErr ? '<span class="badge badge-danger">作业纠错</span>' : ''}
              </div>
            </div>
            <div class="p-stem">${p.stem}</div>
            <div class="p-actions">
              <button class="btn" onclick="toggleBox('hint-${p.id}')">💡 解题提示</button>
              <button class="btn btn-primary" onclick="toggleBox('ans-${p.id}')">🎯 标准答案</button>
              <button class="btn" onclick="toggleBox('sol-${p.id}')">📖 详细解析</button>
              <button class="btn ${m ? 'btn-success' : ''}" onclick="toggleMaster('${p.id}')">${m ? '✅ 已掌握' : '⬜ 标记已掌握'}</button>
              <button class="btn ${s ? 'btn-warn' : ''}" onclick="toggleStar('${p.id}')">${s ? '⭐ 已在错题本' : '☆ 加入错题本'}</button>
            </div>
            <div class="p-hint" id="hint-${p.id}"><strong>思路提示：</strong>${p.hint}</div>
            <div class="p-ans ${allAnsOpen ? 'open' : ''}" id="ans-${p.id}"><strong>【标准答案】</strong>${p.ans}</div>
            <div class="p-sol ${allSolOpen ? 'open' : ''}" id="sol-${p.id}">
              <strong>【详细解析】</strong><br/>${p.sol}
              ${p.errNote ? `<div class="p-err">${p.errNote}</div>` : ''}
            </div>
          </div>`;
      }).join('');
      renderMath(box);
    }

    window.toggleBox = (id) => document.getElementById(id).classList.toggle('open');
    window.toggleMaster = (id) => { state.mastered[id] = !state.mastered[id]; saveState(); render(); };
    window.toggleStar = (id) => { state.starred[id] = !state.starred[id]; saveState(); render(); };

    document.querySelectorAll('#srcFilters .chip').forEach(c => c.addEventListener('click', () => {
      document.querySelectorAll('#srcFilters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active'); srcFilter = c.dataset.src; render();
    }));
    document.querySelectorAll('#chFilters .chip').forEach(c => c.addEventListener('click', () => {
      document.querySelectorAll('#chFilters .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active'); chFilter = c.dataset.ch; render();
    }));

    document.getElementById('toggleAllAns').addEventListener('click', (e) => {
      allAnsOpen = !allAnsOpen;
      e.target.textContent = allAnsOpen ? '🙈 一键隐藏全部答案' : '🎯 一键显示全部答案';
      render();
    });
    document.getElementById('toggleAllSol').addEventListener('click', (e) => {
      allSolOpen = !allSolOpen;
      e.target.textContent = allSolOpen ? '🙈 一键收起全部解析' : '👁️ 一键展开全部解析';
      render();
    });
    document.getElementById('themeBtn').addEventListener('click', () => {
      state.dark = !state.dark;
      document.body.classList.toggle('dark', state.dark);
      document.getElementById('themeBtn').textContent = state.dark ? '☀️ 日间模式' : '🌙 夜间模式';
      saveState();
    });

    window.addEventListener('load', () => {
      if (state.dark) {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️ 日间模式';
      }
      updateProgress();
      render();
    });
  </script>
